spring:
  application:
    name: motor-movers-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  # A deployment serves one data region (UK, IE or AU): UK data stays in UK hosting, Irish data in the EU, Australian
  # data in Australia. It also picks the country settings below.
  region: ${PLATFORM_REGION:UK}
  # Country settings (common/config/CountrySettings), one block per region. Any value can be overridden by an
  # environment variable: PLATFORM_COUNTRIES_<REGION>_<NAME>, e.g. PLATFORM_COUNTRIES_IE_TAXPERCENT=23 or
  # PLATFORM_COUNTRIES_AU_LEGALENTITY_NAME. Months are 1 (January) to 12. "To confirm" marks values Pat (school year,
  # year names) or Kay (legal entity, go-live decision 1) have still to confirm.
  countries:
    uk:
      name: United Kingdom
      currency: GBP
      locale: en-GB
      tax-label: VAT
      tax-percent: 20
      time-zone: Europe/London
      # How times are labelled in reminders and on forms.
      time-label: UK time
      # Where this deployment's data is held, for the website; confirm it against the server chosen. Blank leaves the
      # line off rather than claiming a place.
      data-held-in: the UK
      # September to August, three terms; assessment points: start Sep-Dec, middle Jan-Apr, end May-Aug.
      school-year: { first-month: 9, last-month: 8, terms: 3, start-month: 9, middle-month: 1, end-month: 5 }
      year-names: Nursery, Reception, Year 1, Year 2, Year 3
      # To confirm (accountant, go-live task 17), here and for the other countries.
      credit-note-title: Credit note
      legal-entity: &placeholder-entity
        # To confirm (Kay): suggested Neuroway for the UK and Ireland. A production deployment refuses to start until
        # every value is set (PLATFORM_COUNTRIES_<REGION>_LEGALENTITY_<NAME>); leave one blank if it does not apply.
        name: To be confirmed
        address: To be confirmed
        company-number: To be confirmed
        tax-number-label: VAT number
        tax-number: To be confirmed
        email: To be confirmed
        phone: To be confirmed
    ie:
      name: Ireland
      currency: EUR
      locale: en-IE
      tax-label: VAT
      tax-percent: 23
      time-zone: Europe/Dublin
      time-label: Irish time
      data-held-in: the EU
      # September to June, three terms. To confirm (Pat): start Sep-Dec, middle Jan-Mar, end Apr-Aug.
      school-year: { first-month: 9, last-month: 6, terms: 3, start-month: 9, middle-month: 1, end-month: 4 }
      # To confirm (Pat).
      year-names: Preschool, Junior Infants, Senior Infants, First Class, Second Class
      credit-note-title: Credit note
      legal-entity: *placeholder-entity
    au:
      name: Australia
      currency: AUD
      locale: en-AU
      tax-label: GST
      tax-percent: 10
      # Queensland: no daylight saving.
      time-zone: Australia/Brisbane
      time-label: Queensland time
      data-held-in: Australia
      # January to December, four terms. To confirm (Pat): start Jan-Apr, middle May-Aug, end Sep-Dec.
      school-year: { first-month: 1, last-month: 12, terms: 4, start-month: 1, middle-month: 5, end-month: 9 }
      # To confirm (Pat).
      year-names: Kindy, Prep, Year 1, Year 2, Year 3
      credit-note-title: Adjustment note
      # To confirm (Kay): suggested one of our Australian companies.
      legal-entity:
        <<: *placeholder-entity
        tax-number-label: ABN
  # Records of children who have left are deleted this many days after their leaving date.
  retention-days: 365
  # A class below this daily participation rate is flagged on the head teacher dashboard.
  participation-flag-threshold: 0.70
  # Motor Movers at Home: families whose school is not on Motor Movers (docs/home-programme-design.md).
  home-programme: ${HOME_PROGRAMME:true}
  jwt:
    # Override in every real environment (env var PLATFORM_JWT_SECRET). Must be at least 32 bytes.
    secret: ${PLATFORM_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: 480
    # Parent app: stay signed in for 30 days on the parent's own phone.
    parent-ttl-minutes: 43200
  cors:
    # 5173: web app (Vite). 4173: production build in vite preview (browser tests). 8081: parent app in a
    # browser (Expo web). The native apps do not need CORS.
    allowed-origins: http://localhost:5173,http://localhost:4173,http://localhost:8081
  mail:
    from: ${PLATFORM_MAIL_FROM:Motor Movers <no-reply@localhost>}
    # Where links in emails point (password reset, staff invites).
    web-url: ${PLATFORM_WEB_URL:http://localhost:5173}
  # First Motor Movers team account on a new deployment, emailed a sign-in link (see AdminBootstrap).
  admin-email: ${PLATFORM_ADMIN_EMAIL:}
  # Where the public website's enquiry form (price guide, applying) sends enquiries. The owner's address while the
  # form is tried out, so no test enquiry reaches Pat; set PLATFORM_ENQUIRY_EMAIL to the team's address for go-live.
  enquiry-email: ${PLATFORM_ENQUIRY_EMAIL:sagarnikamforu@gmail.com}
  # Load tests only (deploy/loadtest/live-session.js): sign-ins allowed per network address every 15 minutes, and
  # how many extra parent accounts the demo data books on its live cohort. Production refuses a raised limit.
  login-limit-per-ip: ${LOGIN_LIMIT_PER_IP:50}
  load-test-learners: ${LOAD_TEST_LEARNERS:0}
  # Live course sessions on Zoom (training/zoom/ZoomProperties). Without every key, sessions run without video.
  zoom:
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
    sdk-key: ${ZOOM_SDK_KEY:}
    sdk-secret: ${ZOOM_SDK_SECRET:}
    host-email: ${ZOOM_HOST_EMAIL:}
  # Notifications to the parent app through Expo (notification/service/PushProperties). Off: only logged.
  push:
    enabled: ${PUSH_ENABLED:false}
    access-token: ${EXPO_ACCESS_TOKEN:}
  # Paying by card with Stripe Checkout (payment/stripe/StripeProperties). Without both, payments are marked by hand.
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # LOCK_TIMEOUT: wait for a row lock (e.g. a live session's meeting being created) as PostgreSQL does.
    url: jdbc:h2:mem:motormovers;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password:
  h2:
    console:
      enabled: true

platform:
  seed-demo-data: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/motormovers}
    username: ${DATABASE_USERNAME:motormovers}
    password: ${DATABASE_PASSWORD:motormovers}

platform:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  seed-starter-content: ${SEED_STARTER_CONTENT:false}

---
# Production: PostgreSQL, real mail, behind a TLS-terminating proxy. ProductionChecks refuses to start
# with development settings. Every value comes from the environment; see deploy/.env.example.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  # Trust X-Forwarded-* from the proxy in front, so client addresses (rate limits) and https are right.
  forward-headers-strategy: native
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

platform:
  region: ${PLATFORM_REGION:UK}
  seed-demo-data: false
  # Starter content as drafts on an empty platform (seed/StarterContentLoader).
  seed-starter-content: ${SEED_STARTER_CONTENT:false}
  # Off until the owner and Pat are ready to offer the home programme.
  home-programme: ${HOME_PROGRAMME:false}
  jwt:
    secret: ${PLATFORM_JWT_SECRET:}
  cors:
    allowed-origins: ${PLATFORM_WEB_URL}
