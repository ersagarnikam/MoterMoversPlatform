spring:
  application:
    name: motor-movers-platform
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

platform:
  # A deployment serves one data region. UK data stays in UK hosting, Australian data in Australia.
  region: UK
  # Records of children who have left are deleted this many days after their leaving date.
  retention-days: 365
  # A class below this daily participation rate is flagged on the head teacher dashboard.
  participation-flag-threshold: 0.70
  jwt:
    # Override in every real environment (env var PLATFORM_JWT_SECRET). Must be at least 32 bytes.
    secret: ${PLATFORM_JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: 480
    # Parent app: stay signed in for 30 days on the parent's own phone.
    parent-ttl-minutes: 43200
  cors:
    # 5173: web app (Vite). 4173: production build in vite preview (browser tests). 8081: parent app in a
    # browser (Expo web). The native apps do not need CORS.
    allowed-origins: http://localhost:5173,http://localhost:4173,http://localhost:8081
  mail:
    from: ${PLATFORM_MAIL_FROM:Motor Movers <no-reply@localhost>}
    # Where links in emails point (password reset, staff invites).
    web-url: ${PLATFORM_WEB_URL:http://localhost:5173}
  # First Motor Movers team account on a new deployment, emailed a sign-in link (see AdminBootstrap).
  admin-email: ${PLATFORM_ADMIN_EMAIL:}
  # Load tests only (deploy/loadtest/live-session.js): sign-ins allowed per network address every 15 minutes, and
  # how many extra parent accounts the demo data books on its live cohort. Production refuses a raised limit.
  login-limit-per-ip: ${LOGIN_LIMIT_PER_IP:50}
  load-test-learners: ${LOAD_TEST_LEARNERS:0}
  # Live course sessions on Zoom (training/zoom/ZoomProperties). Without every key, sessions run without video.
  zoom:
    account-id: ${ZOOM_ACCOUNT_ID:}
    client-id: ${ZOOM_CLIENT_ID:}
    client-secret: ${ZOOM_CLIENT_SECRET:}
    sdk-key: ${ZOOM_SDK_KEY:}
    sdk-secret: ${ZOOM_SDK_SECRET:}
    host-email: ${ZOOM_HOST_EMAIL:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # LOCK_TIMEOUT: wait for a row lock (e.g. a live session's meeting being created) as PostgreSQL does.
    url: jdbc:h2:mem:motormovers;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password:
  h2:
    console:
      enabled: true

platform:
  seed-demo-data: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/motormovers}
    username: ${DATABASE_USERNAME:motormovers}
    password: ${DATABASE_PASSWORD:motormovers}

platform:
  seed-demo-data: ${SEED_DEMO_DATA:false}
  seed-starter-content: ${SEED_STARTER_CONTENT:false}

---
# Production: PostgreSQL, real mail, behind a TLS-terminating proxy. ProductionChecks refuses to start
# with development settings. Every value comes from the environment; see deploy/.env.example.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  # Trust X-Forwarded-* from the proxy in front, so client addresses (rate limits) and https are right.
  forward-headers-strategy: native
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  structured:
    format:
      console: ecs

platform:
  region: ${PLATFORM_REGION:UK}
  seed-demo-data: false
  # Starter content as drafts on an empty platform (seed/StarterContentLoader).
  seed-starter-content: ${SEED_STARTER_CONTENT:false}
  jwt:
    secret: ${PLATFORM_JWT_SECRET:}
  cors:
    allowed-origins: ${PLATFORM_WEB_URL}
