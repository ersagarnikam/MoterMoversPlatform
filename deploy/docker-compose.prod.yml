# Production on one server: Caddy (HTTPS) -> web (nginx + app) -> api -> db, plus nightly backups.
#   cp deploy/.env.example deploy/.env   # fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# See deploy/RUNBOOK.md.
name: motor-movers

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motormovers
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d motormovers"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published: only the api can reach the database.

  api:
    build: ../backend
    image: motor-movers-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/motormovers
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PLATFORM_REGION: ${PLATFORM_REGION:-UK}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET}
      PLATFORM_WEB_URL: https://${APP_DOMAIN}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      SEED_STARTER_CONTENT: ${SEED_STARTER_CONTENT:-false}
      HOME_PROGRAMME: ${HOME_PROGRAMME:-false}
      ZOOM_ACCOUNT_ID: ${ZOOM_ACCOUNT_ID:-}
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:-}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:-}
      ZOOM_SDK_KEY: ${ZOOM_SDK_KEY:-}
      ZOOM_SDK_SECRET: ${ZOOM_SDK_SECRET:-}
      ZOOM_HOST_EMAIL: ${ZOOM_HOST_EMAIL:-}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PLATFORM_MAIL_FROM: ${PLATFORM_MAIL_FROM}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

  web:
    build: ../frontend
    image: motor-movers-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Nightly compressed dump at 02:00, keeping 14 days. Copy ./backups off the server too (see RUNBOOK).
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${DATABASE_USERNAME}
      PGPASSWORD: ${DATABASE_PASSWORD}
      PGDATABASE: motormovers
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0200" ]; then
            f=/backups/motormovers-$$(date +%Y%m%d).sql.gz
            pg_dump --no-owner | gzip > "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup ok $$f"
            find /backups -name 'motormovers-*.sql.gz' -mtime +14 -delete
            sleep 60
          fi
          sleep 30
        done

  # Copies the nightly dumps off the server: once at start, so a wrong setting shows straight away, then
  # daily at 03:00. Off unless started with the offsite profile; the remote is set in .env (see RUNBOOK).
  offsite:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    profiles: [offsite]
    environment:
      RCLONE_CONFIG_OFFSITE_TYPE: ${BACKUP_OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_OFFSITE_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_OFFSITE_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_OFFSITE_SECRET_ACCESS_KEY:-}
      BACKUP_OFFSITE_PATH: ${BACKUP_OFFSITE_PATH:-}
    volumes:
      - ./backups:/backups:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        copy() {
          if rclone copy /backups "offsite:$$BACKUP_OFFSITE_PATH" --include "motormovers-*.sql.gz" \
              --retries 2 --low-level-retries 3 --contimeout 20s --timeout 2m -v; then
            echo "offsite copy ok $$(date +%F)"
          else
            echo "offsite copy FAILED $$(date +%F)"
          fi
        }
        copy
        while true; do
          if [ "$$(date +%H%M)" = "0300" ]; then copy; sleep 60; fi
          sleep 30
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
