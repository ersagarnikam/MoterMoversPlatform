name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Browser tests: the production web build (with the production CSP) against the API with demo data.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          mvn -B -q package -DskipTests
          nohup java -jar target/motor-movers-platform-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/e2e-results
            backend/api.log

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Node 24 (npm 11), as the lock file was written with: npm 10 resolves Expo's optional peer
      # dependencies differently and rejects it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Bundles the Android app to catch import and routing errors a typecheck misses.
      - run: npx expo export --platform android --output-dir dist
