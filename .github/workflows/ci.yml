name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Unit tests of the web app's logic (Vitest): money, session times, the offline queue, the API client.
      - run: npm test
      - run: npm run build

  # Browser tests: the production web build (with the production CSP) against the API with demo data.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        env:
          # The browser tests sign in more than the 50 times in 15 minutes one address is allowed; tests only.
          LOGIN_LIMIT_PER_IP: '500'
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/motor-movers-platform-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/e2e-results
            backend/api.log

  # A short live-session rush with k6: learners pressing Join together while the host's register refreshes.
  # Fails the build if any join fails, is slow, or is missing from the register. Zoom is not connected here.
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start the API with load-test learners
        working-directory: backend
        env:
          LOAD_TEST_LEARNERS: '100'
          LOGIN_LIMIT_PER_IP: '500'
        run: |
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/motor-movers-platform-*.jar > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && break; sleep 2; done
      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz | tar xz
          sudo mv k6-v2.3.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Live session rush
        working-directory: deploy/loadtest
        run: k6 run -e LEARNERS=50 -e RUSH=10 live-session.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-api-log
          path: backend/api.log

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # Node 24 (npm 11), as the lock file was written with: npm 10 resolves Expo's optional peer
      # dependencies differently and rejects it.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Bundles the Android app to catch import and routing errors a typecheck misses.
      - run: npx expo export --platform android --output-dir dist
