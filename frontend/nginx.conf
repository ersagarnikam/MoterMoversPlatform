# Serves the built web app and passes /api to the API. TLS ends at the proxy in front (Caddy in
# deploy/docker-compose.prod.yml). ${API_UPSTREAM} and ${STORAGE_ORIGIN} are filled in by the nginx image at start-up.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Caddy logs each request, with what must stay private filtered out. Here a request line would carry a password
    # link's token, and an error line its Referer, so only serious errors are kept.
    access_log off;
    error_log /var/log/nginx/error.log crit;

    # Requests here are small (uploaded files go straight to the file store); this keeps abuse cheap to refuse.
    client_max_body_size 2m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Fingerprinted build output never changes, so browsers can keep it.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # These two pages must not use `try_files $uri /index.html`: its last step is an internal redirect to location /, and
    # that block's headers then replace these. frontend/check-headers.sh tests it on nginx itself, in CI.

    # A live course session runs Zoom's Meeting SDK, so this page alone allows Zoom's scripts, styles, workers
    # and servers, and the camera and microphone. Keep it the same as LIVE_CSP in vite.config.ts.
    location ~ ^/live/[0-9]+/?$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://source.zoom.us https://dmogdx0jrul3u.cloudfront.net 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob: https://source.zoom.us https://dmogdx0jrul3u.cloudfront.net; style-src 'self' 'unsafe-inline' https://source.zoom.us; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data: https://source.zoom.us; connect-src 'self' https://*.zoom.us wss://*.zoom.us https://source.zoom.us https://dmogdx0jrul3u.cloudfront.net blob: data:; frame-src 'self' https://*.zoom.us; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }

    # The content page uploads straight to the file store, so this page alone may reach it. Keep it the same as
    # CONTENT_CSP in vite.config.ts. The app reaches this page with a full page load, or this policy would not apply.
    location ~ ^/admin/content/?$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; connect-src 'self' ${STORAGE_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files /index.html =404;
    }

    # Every other path is a screen in the app: always fetch the latest index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        try_files $uri /index.html;
    }
}
